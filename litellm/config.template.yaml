model_list:
  - model_name: ${LITELLM_MODEL_NAME}
    litellm_params:
      model: openai/${VLLM_MODEL_ID}
      api_base: ${VLLM_BASE_URL}
      api_key: ${VLLM_API_KEY}
      chat_template_kwargs:
        enable_thinking: false

  - model_name: ${LITELLM_MODEL_NAME_LOW}
    litellm_params:
      model: openai/${VLLM_MODEL_ID}
      api_base: ${VLLM_BASE_URL}
      api_key: ${VLLM_API_KEY}
      chat_template_kwargs:
        reasoning_effort: low

  - model_name: ${LITELLM_MODEL_NAME_MID}
    litellm_params:
      model: openai/${VLLM_MODEL_ID}
      api_base: ${VLLM_BASE_URL}
      api_key: ${VLLM_API_KEY}
      chat_template_kwargs:
        reasoning_effort: medium

  - model_name: ${LITELLM_MODEL_NAME_HIGH}
    litellm_params:
      model: openai/${VLLM_MODEL_ID}
      api_base: ${VLLM_BASE_URL}
      api_key: ${VLLM_API_KEY}
      chat_template_kwargs:
        reasoning_effort: high

  - model_name: ${LITELLM_MODEL_NAME_XHIGH}
    litellm_params:
      model: openai/${VLLM_MODEL_ID}
      api_base: ${VLLM_BASE_URL}
      api_key: ${VLLM_API_KEY}
      chat_template_kwargs:
        reasoning_effort: xhigh

  # Claude Code (Anthropic Messages API). Routed to vLLM's native
  # /v1/messages implementation (anthropic passthrough), NOT the OpenAI
  # Responses API translation: vLLM handles Claude Code's mid-conversation
  # system messages natively. api_base is the vLLM origin WITHOUT /v1.
  - model_name: ${LITELLM_MODEL_NAME}-ant
    litellm_params:
      model: anthropic/${VLLM_MODEL_ID}
      api_base: ${VLLM_ANTHROPIC_BASE_URL}
      api_key: ${VLLM_API_KEY}
    # Capability flags registered in litellm.model_cost under the shared
    # "anthropic/${VLLM_MODEL_ID}" key (all deployments of this backend share
    # them). They tell litellm the backend understands output_config.effort,
    # so Claude Code's per-request effort (sonnet-class calls send high,
    # haiku-class send low) is forwarded verbatim to vLLM's /v1/messages,
    # which maps it to the chat template's reasoning_effort. The template
    # only accepts xhigh/high/medium/low and raises on anything else, so
    # max/minimal are deliberately NOT advertised: litellm will 400 them
    # instead of the template blowing up.
    model_info:
      max_tokens: 32768
      supports_output_config: true
      supports_low_reasoning_effort: true
      supports_xhigh_reasoning_effort: true

  # Claude model class aliases, generated by render_config.py. Claude Code
  # "auto mode" makes side calls against the claude-sonnet-* (decisions) and
  # claude-haiku-* (quick tasks) model classes; mapping the whole class to
  # the anthropic passthrough backend keeps them on this engine. Effort is
  # per-request (see flags above), so aliases carry no extra params.
CLAUDE_ALIAS_DEPLOYMENTS

general_settings:
  coordination_redis:
    url: os.environ/REDIS_URL

litellm_settings:
  drop_params: true
  num_retries: 0
